[package]
name = "concat-speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Speech in and out: on-device transcription with whisper.cpp, and text to speech with Kokoro."

[dependencies]
concat-host.workspace = true
concat-media.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

# Model downloads. Blocking on purpose: downloads run on their own thread,
# and an async HTTP stack would be a second runtime's worth of dependencies
# for one GET.
ureq = "2"

# Kokoro models arrive as tar.bz2 archives, hence tar + bzip2 (pure-Rust
# decoder) for unpacking them.
tar = "0.4"
bzip2 = "0.6"

# Transcription: whisper.cpp in-process. Built from source by cmake at build
# time.
whisper-rs = "0.16"

# Text to speech: the official k2-fsa bindings. Linked statically on the
# Linux development build, so the binary carries no extra libraries.
[target.'cfg(not(target_os = "android"))'.dependencies]
sherpa-onnx = "1.13"

# On the phone it is what k2-fsa publishes: one archive of .so files per
# Android ABI, which the app's jniLibs carry. The sys crate downloads the
# right one for the target on its own.
[target.'cfg(target_os = "android")'.dependencies]
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }

[lints]
workspace = true
