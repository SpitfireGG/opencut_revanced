name: Build Android

# Builds Concat for Android only - uploads one artifact:
#   Android arm64  -> Concat-<version>-android-arm64.apk
#
# Reusable: release.yml can call it on every tag.
#
# Android is cross-compiled - the job runs on Linux with the NDK.
# The native libraries that cannot be fetched prebuilt are built from
# source here and cached: FFmpeg by src/scripts/ffmpeg-mobile.sh,
# with the platform's hardware codecs, and whisper.cpp by its crate.
# sherpa-onnx comes prebuilt from k2-fsa through src/scripts/sherpa-mobile.sh.
#
# src/scripts/mobile-env.sh is the one description of the build
# environment, here and on a developer's machine.
#
# The APK is signed with the repository's key when ANDROID_KEYSTORE (the
# keystore, base64) and ANDROID_KEYSTORE_PASSWORD are set as secrets, and
# with a key made for the run when they are not.
on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE:
        description: Base64 of the release keystore
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  GGML_NATIVE: "OFF"

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Concat $version for aarch64-linux-android"
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-linux-android
        working-directory: src
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-apk

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      - name: FFmpeg for Android (cached)
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ffmpeg-aarch64-linux-android-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}
      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: src/scripts/ffmpeg-mobile.sh aarch64-linux-android
      - name: FFmpeg for Android (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: sherpa-onnx for Android
        run: src/scripts/sherpa-mobile.sh aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: aarch64-linux-android

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keystore=$RUNNER_TEMP/release.keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$keystore"
            password=$KEYSTORE_PASSWORD
          else
            password=concat
            keytool -genkeypair -v -keystore "$keystore" -storepass "$password" -keypass "$password" \
              -alias concat -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Concat, O=Concat" >/dev/null 2>&1
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: src
        run: |
          set -o pipefail
          eval "$(scripts/mobile-env.sh aarch64-linux-android)"
          cargo apk build --release -p concat-android 2>&1 | tee build.log

      - name: Build log to the summary (failure only)
        if: failure()
        run: |
          if [ -f src/build.log ]; then
            {
              echo "### Build failed: Android arm64"
              echo '```'
              tail -n 150 src/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir stage
          cp src/target/release/apk/Concat.apk "stage/Concat-$VERSION-android-arm64.apk"
          ls -l stage

      - uses: actions/upload-artifact@v7
        with:
          name: Concat-android-arm64
          path: stage/*
          if-no-files-found: error